# qwentts.cpp(로컬 TTS 엔진) 윈도 실행 파일을 만들어 이 저장소의 릴리스에 올린다.
#
# **왜 여기(공개 저장소)인가.** 소스 저장소는 비공개라 Actions 분이 유료다
# (윈도 러너는 2배, 맥은 10배). 이 저장소는 공개라 **같은 일이 무료**다.
# 만드는 것은 공개 MIT 프로젝트이고 우리 비밀이 하나도 안 들어가므로 여기서
# 지어도 잃을 것이 없다. 덤으로 올릴 때 이 저장소의 `GITHUB_TOKEN` 을 그대로
# 써서 별도 토큰이 필요 없다.
#
# **맥은 여기서 안 짓는다.** 개발 맥에서 지어 손으로 올린다 — Apple Silicon
# 러너는 10배인데 우리가 맥을 이미 갖고 있다.
#
# **한 번 돌려서 둘 다 알아낸다.** 예산이 빠듯하니 Vulkan 설치가 실패해도
# 멈추지 않고 CPU 전용으로 지어 올린다. 두 번 돌리지 않으려는 것이다.
name: 로컬 TTS 엔진 (윈도)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'qwentts.cpp 커밋 SHA. 태그가 없는 저장소라 SHA 로 못 박는다.'
        required: true
        default: '90efdc60d62f7d6c70113994d0be17e820fd8673'

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    steps:
      # **입력을 run 안에 그대로 박지 않는다.** `${{ }}` 는 셸에 들어가기 전에
      # 펼쳐지므로 SHA 자리에 명령을 넣으면 그게 실행된다. env 로 건넨다.
      - name: 소스를 받는다
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -e
          case "$SHA" in *[!0-9a-fA-F]*|"") echo "SHA 가 16진수가 아니다"; exit 1;; esac
          git clone https://github.com/ServeurpersoCom/qwentts.cpp q
          cd q
          git checkout "$SHA"
          git submodule update --init --recursive --depth 1
          echo "받은 판: $(git rev-parse HEAD)"

      # **Vulkan 하나면 NVIDIA·AMD·인텔 내장을 다 덮는다.** CUDA 는 NVIDIA 에서만
      # 돌고 툴킷 설치로 러너 시간이 훨씬 든다(예산) — 나중에 필요하면 더한다.
      #
      # 실패해도 멈추지 않는다. 그때는 CPU 전용으로 짓는다 — 돌아는 간다.
      # 남의 액션이라 **커밋 SHA 로 못 박는다**(태그는 옮길 수 있다).
      - name: Vulkan SDK (실패해도 계속)
        id: vulkan
        continue-on-error: true
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      # **SPIRV-Headers 는 Vulkan SDK 와 별개다.** ggml 의 Vulkan 백엔드가
      # `find_package(SPIRV-Headers CONFIG REQUIRED)` 를 하는데 SDK 1.3.290 에는
      # 그 cmake 설정이 없어 첫 판이 여기서 죽었다(실측 2026-09-16, run 35096445607).
      # llama.cpp 도 리눅스에서 `spirv-headers` 를 따로 깐다.
      #
      # SDK 판 배치에 기대지 말고 **SDK 와 같은 판의 태그**를 직접 깐다 — 헤더만
      # 있는 것이라 몇 초면 끝난다. 남의 저장소라 커밋 SHA 로 못 박는다.
      - name: SPIRV-Headers (Vulkan 을 깔았을 때만)
        id: spirv
        if: steps.vulkan.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          git clone https://github.com/KhronosGroup/SPIRV-Headers sh
          cd sh && git checkout 2acb319af38d43be3ea76bfabf3998e5281d8d12  # vulkan-sdk-1.3.290.0
          cd ..
          cmake -S sh -B sh-build -DCMAKE_INSTALL_PREFIX="$PWD/sh-install"
          cmake --build sh-build --target install --config Release
          # 설치 자리는 판마다 다를 수 있다 — 찾아서 쓴다.
          #
          # **절대 경로여야 한다.** 다음 걸음은 `q/` 안에서 도니 상대 경로는 엉뚱한
          # 데를 가리킨다 — 두 번째 판이 이걸로 죽었다(run 35096766409:
          # 「찾음: sh-install/share/cmake/SPIRV-Headers」).
          # 그리고 cmake 는 네이티브 프로그램이라 MSYS 의 `/d/a/…` 를 못 읽는다 —
          # `pwd -W` 가 `C:/…` 꼴로 준다.
          DIR=$(dirname "$(find sh-install -name 'SPIRV-HeadersConfig.cmake' | head -1)")
          [ -n "$DIR" ] && [ -d "$DIR" ] || { echo "SPIRV-HeadersConfig.cmake 를 못 찾았다"; exit 1; }
          # **`A && B || C && D` 로 쓰지 않는다.** 왼쪽부터 묶여서 `((A&&B)||C)&&D` 가 되고,
          # B 가 성공해도 D 가 또 돈다 — 값이 두 줄이 되어 GitHub 출력이 거부했다
          # (run 35097437762: 「Invalid format '/d/a/…'」). 여기선 pwd -W 하나면 된다.
          ABS=$(cd "$DIR" && pwd -W)
          echo "찾음: $ABS"
          echo "dir=$ABS" >> "$GITHUB_OUTPUT"

      # 위쪽 `buildall.cmd` 가 켜는 것과 같은 깃발이다(CUDA 만 뺐다).
      # `GGML_BACKEND_DL=ON` 이면 백엔드를 **실행할 때** 고른다 — Vulkan 드라이버가
      # 없는 기계에서도 CPU 로 떨어져 뜨기는 뜬다. 그게 없으면 아예 안 뜬다.
      # `GGML_CPU_ALL_VARIANTS=ON` 은 명령어 집합별 CPU 판을 다 담아 옛 CPU 도 돈다.
      - name: 만든다
        shell: bash
        working-directory: q
        env:
          VULKAN_OK: ${{ steps.vulkan.outcome }}
          SPIRV_OK: ${{ steps.spirv.outcome }}
          SPIRV_DIR: ${{ steps.spirv.outputs.dir }}
        run: |
          set -e
          if [ "$VULKAN_OK" = "success" ] && [ "$SPIRV_OK" = "success" ]; then
            [ -f "$SPIRV_DIR/SPIRV-HeadersConfig.cmake" ] || {
              echo "건네받은 자리에 설정이 없다: $SPIRV_DIR"; exit 1; }
            echo "Vulkan 켜고 짓는다 (SPIRV-Headers: $SPIRV_DIR)"
            EXTRA="-DGGML_VULKAN=ON -DSPIRV-Headers_DIR=$SPIRV_DIR"
          else
            echo "Vulkan 준비가 안 됐다(vulkan=$VULKAN_OK spirv=$SPIRV_OK) — CPU 전용으로 짓는다"
            EXTRA=""
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON $EXTRA
          cmake --build build --config Release -j 4 --target tts-server qwen-tts qwen-codec

      # **만들어졌다와 돈다는 다른 말이다.** 모델 없이도 `--help` 는 떠야 한다 —
      # 안 뜨면 딸린 DLL 이 빠진 것이고, 그건 사용자 기계에서 그대로 터진다.
      #
      # **종료 코드로 보지 않는다.** `qwen-tts --help` 는 도움말을 다 찍고도 1 로
      # 끝난다(맥에서도 그렇다 — 실측 2026-09-16). 세 번째 판이 이걸 「안 돈다」로
      # 잘못 읽고 죽었다(run 35097019450). **출력에 도움말이 있는지**를 본다 —
      # 그게 「프로세스가 떠서 제 글을 찍었다」는 진짜 증거다.
      - name: 도는지 본다
        shell: bash
        working-directory: q
        run: |
          set -e
          mkdir -p ../out
          for n in tts-server qwen-tts qwen-codec; do
            BIN=$(find build -name "$n.exe" -type f | head -1)
            [ -n "$BIN" ] || { echo "$n.exe 가 안 만들어졌다"; exit 1; }
            echo "찾음: $BIN"
            OUT=$("$BIN" --help 2>&1 || true)
            case "$OUT" in *Usage:*) echo "  도움말을 찍었다";; *)
              echo "$n 이 안 돈다 — 찍은 것:"; echo "$OUT" | head -5; exit 1;; esac
            cp "$BIN" ../out/
          done
          # 실행할 때 고르는 백엔드들 — 이게 빠지면 GPU 도 못 쓰고 CPU 판도 못 고른다.
          find build -name "*.dll" -exec cp {} ../out/ \;
          ls -la ../out

      # 해시를 찍어 둔다 — 받는 쪽(`scripts/fetch-qwentts.mjs`)이 이 값을 박아 두고
      # 대조한다. 받아 온 것이 우리가 만든 그것인지 확인하지 않으면 동봉이 아니라 도박이다.
      - name: 담고 해시를 찍는다
        shell: bash
        run: |
          set -e
          cd out
          for f in tts-server qwen-tts qwen-codec; do mv "$f.exe" "$f-win32-x64.exe"; done
          sha256sum * | tee SHA256SUMS-win32-x64.txt

      - name: 릴리스에 올린다
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # **이 워크플로는 checkout 을 안 한다** — 소스를 우리가 직접 clone 하니 필요가 없다.
          # 그래서 `gh` 가 git 폴더로 저장소를 알아낼 수 없다(run 35097437762:
          # 「fatal: not a git repository」). 이름을 env 로 준다.
          GH_REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          VULKAN_OK: ${{ steps.vulkan.outcome }}
          SPIRV_OK: ${{ steps.spirv.outcome }}
        run: |
          set -e
          [ "$VULKAN_OK" = success ] && [ "$SPIRV_OK" = success ] && BACKENDS="Vulkan + CPU" || BACKENDS="CPU 전용"
          TAG="tools-qwentts-${SHA:0:7}"
          # **반드시 프리릴리스다.** 보통 릴리스로 올리면 GitHub 「Latest」가 되어
          # 앱의 업데이트 확인이 그 태그에서 latest-mac.yml 을 찾다 404 로 죽는다
          # (실제로 하루 동안 그랬다 — 소스 저장소 docs/배포-함정.md §14).
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "도구: 로컬 TTS 엔진 qwentts.cpp ${SHA:0:7}" \
            --notes "Dekoy 가 동봉하는 로컬 TTS 엔진. 앱이 아니라 도구다. 위쪽: ServeurpersoCom/qwentts.cpp (MIT), 커밋 ${SHA}. 윈도 백엔드: $BACKENDS"
          gh release upload "$TAG" out/* --clobber
          echo "== 올라간 것 =="
          gh release view "$TAG" --json assets -q '.assets[].name'
          echo "== Latest 가 이걸로 바뀌지 않았는지(바뀌면 앱 업데이트가 죽는다) =="
          gh api "repos/${GH_REPO}/releases/latest" -q .tag_name
